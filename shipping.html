```html
<!DOCTYPE html>
<html lang="en" ng-app="shippingApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping - Nick's Soccer Goods</title>

    <!-- TEAM TASK 3: BOOTSTRAP -->
    <!-- Author: Jason Mathew - HTML Developer and Documentation -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- TEAM TASK 6: JQUERY -->
    <!-- Author: Jason Mathew - HTML Developer and Documentation -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- TEAM TASK 8: ANGULARJS -->
    <!-- Author: Jason Mathew - HTML Developer and Documentation -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <!-- TEAM TASK 2: CSS STYLING -->
    <!-- Author: Nick Golter - CSS Designer and Layout -->
    <style>
        body {
            background-color: #f5f5f5;
        }

        .shipping-box {
            background-color: white;
            padding: 30px;
            margin-top: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #176b2c;
        }

        .json-output {
            background-color: #f1f3f5;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body ng-controller="ShippingController">

    <!-- TEAM TASK 1: HTML STRUCTURE -->
    <!-- Author: Jason Mathew - HTML Developer and Documentation -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                ⚽ Nick's Soccer Goods
            </a>

            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="product.html">Products</a>
                <a class="nav-link" href="shoppingcart.html">Shopping Cart</a>
                <a class="nav-link active" href="shipping.html">Shipping</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="shipping-box">

            <h1>Shipping Carrier Information</h1>
            <p>Enter your shipping information below.</p>

            <!-- TEAM TASK 4: FORM VALIDATION -->
            <!-- Author: Aziz Abilkosimov - Project Coordinator and Quality Tester -->

            <form name="shippingForm"
                  ng-submit="displayJSON()"
                  novalidate>

                <div class="mb-3">
                    <label for="address" class="form-label">Address:</label>
                    <input type="text"
                           id="address"
                           class="form-control"
                           ng-model="shipping.address"
                           required>
                </div>

                <div class="mb-3">
                    <label for="city" class="form-label">City:</label>
                    <input type="text"
                           id="city"
                           class="form-control"
                           ng-model="shipping.city"
                           required>
                </div>

                <div class="mb-3">
                    <label for="state" class="form-label">State:</label>
                    <input type="text"
                           id="state"
                           class="form-control"
                           ng-model="shipping.state"
                           required>
                </div>

                <div class="mb-3">
                    <label for="zip" class="form-label">ZIP Code:</label>
                    <input type="text"
                           id="zip"
                           class="form-control"
                           ng-model="shipping.zip"
                           ng-pattern="/^\d{5}(-\d{4})?$/"
                           placeholder="19001"
                           required>
                </div>

                <!-- TEAM TASK 5: SHIPPING CARRIER INFORMATION -->
                <!-- Author: Kevin Mathew - Research and Product Content -->

                <div class="mb-3">
                    <label for="carrier" class="form-label">
                        Select a shipping carrier:
                    </label>

                    <select id="carrier"
                            class="form-select"
                            ng-model="shipping.carrierName"
                            required>
                        <option value="">Select Carrier</option>
                        <option value="fedex">FedEx</option>
                        <option value="ups">UPS</option>
                        <option value="dhl">DHL</option>
                    </select>
                </div>

                <!-- TEAM TASK 5: SHIPPING METHOD INFORMATION -->
                <!-- Author: Kevin Mathew - Research and Product Content -->

                <div class="mb-3">
                    <label for="method" class="form-label">
                        Select a shipping method:
                    </label>

                    <select id="method"
                            class="form-select"
                            ng-model="shipping.shippingMethod"
                            required>
                        <option value="">Select Method</option>
                        <option value="Overnight">Overnight</option>
                        <option value="2nd Day">2nd Day</option>
                        <option value="Ground">Ground</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">
                    Submit
                </button>

                <p class="text-danger mt-2" ng-show="errorMessage">
                    {{ errorMessage }}
                </p>

            </form>

            <!-- TEAM TASK 5: JSON DOCUMENT -->
            <!-- TEAM TASK 8: ANGULARJS JSON DISPLAY -->
            <!-- Author: Jason Mathew - HTML Developer and Documentation -->

            <div class="mt-4" ng-show="showJSON">
                <h2>Shipping Information JSON:</h2>
                <pre class="json-output">{{ shippingInformationJSON }}</pre>
            </div>

        </div>
    </main>

    <!-- TEAM TASK 4 AND 8: JAVASCRIPT AND ANGULARJS -->
    <!-- Author: Jason Mathew - HTML Developer and Documentation -->

    <script>
        var app = angular.module("shippingApp", []);

        app.controller("ShippingController", function($scope) {

            $scope.shipping = {
                address: "",
                city: "",
                state: "",
                zip: "",
                carrierName: "",
                shippingMethod: ""
            };

            $scope.showJSON = false;
            $scope.errorMessage = "";

            $scope.displayJSON = function() {

                // TEAM TASK 4: FORM VALIDATION
                // Author: Aziz Abilkosimov - Project Coordinator and Quality Tester

                if ($scope.shippingForm.$invalid) {
                    $scope.showJSON = false;
                    $scope.errorMessage =
                        "Please complete all fields and enter a valid ZIP code.";
                    return;
                }

                $scope.errorMessage = "";

                // TEAM TASK 5: CREATE SHIPPING JSON DOCUMENT
                // Author: Jason Mathew - HTML Developer and Documentation

                var shippingData = {
                    address: $scope.shipping.address,
                    city: $scope.shipping.city,
                    state: $scope.shipping.state,
                    zip: $scope.shipping.zip,
                    carrierName: $scope.shipping.carrierName,
                    shippingMethod: $scope.shipping.shippingMethod
                };

                $scope.shippingInformationJSON =
                    angular.toJson(shippingData, true);

                $scope.showJSON = true;
            };
        });

        // TEAM TASK 7: AJAX
        // Author: Aziz Abilkosimov - Project Coordinator and Quality Tester
        // The Node.js REST API will be added in a later assignment.
        // No API request is made for this assignment.

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
